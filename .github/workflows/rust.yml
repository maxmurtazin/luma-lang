name: Rust syntax, semantics and runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-conformance.cjs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --locked
      - run: node tools/test-examples.cjs
      - run: node tools/test-doc-examples.cjs
      - run: cargo test --locked
      - run: cargo run --locked -- check --graph semantic-graph.json conformance/cases/module-public/main.luma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python -B tools/cad/validate.py
      - run: cargo run --locked -- ir tests/fixtures/structural/main.luma > structural-ir.json
      - run: python tools/validate-structural.py structural-ir.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-ir-v1
          path: structural-ir.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-graph-v1
          path: semantic-graph.json
  cad1-core-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: provider
        run: python -c 'import json; print("pin=" + json.load(open("luma-cad.lock.json"))["providers"]["core"]["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: maxmurtazin/living-ir-core
          ref: ${{ steps.provider.outputs.pin }}
          path: _cad_core
      - run: python -B tools/cad/prepare-core-project.py _cad_core
      - run: cargo test --manifest-path _cad_core/Cargo.toml -p living-cad-viewer --features luma-cad luma_cad1_recipe --lib
      - run: cargo build --manifest-path _cad_core/Cargo.toml -p living-cad-viewer --features luma-cad,checkpoint-fault-injection --bin luma-cad-project
      - run: python -B tools/cad/test-core-project.py _cad_core/target/debug/luma-cad-project
