name: Rust syntax, semantics and runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-conformance.cjs
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --locked
      - run: node tools/test-examples.cjs
      - run: node tools/test-doc-examples.cjs
      - run: cargo test --locked
      - run: cargo run --locked -- check --graph semantic-graph.json conformance/cases/module-public/main.luma
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: cargo run --locked -- ir tests/fixtures/structural/main.luma > structural-ir.json
      - run: python tools/validate-structural.py structural-ir.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-ir-v1
          path: structural-ir.json
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-graph-v1
          path: semantic-graph.json
