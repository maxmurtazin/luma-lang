[package]
name = "luma"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Luma bounded checker and execution core"

[dependencies]
luma-cad-contract = { path = "crates/luma-cad-contract" }
luma-cad-engine = { path = "crates/luma-cad-engine" }
luma-host-api = { path = "crates/luma-host-api" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
