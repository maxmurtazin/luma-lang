baseURL: https://maxmurtazin.github.io/luma-lang/
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
languages:
  en:
    label: English
    locale: en
    contentDir: content/en
    weight: 1
  ru:
    label: Русский
    menu:
      main:
        - name: Документация
          pageRef: /docs
          weight: 1
        - name: GitHub
          url: https://github.com/maxmurtazin/luma-lang
          weight: 2
        - name: Поиск
          weight: 3
          params:
            type: search
    locale: ru
    contentDir: content/ru
    weight: 2
title: Luma
module:
  imports:
    - path: github.com/imfing/hextra
menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: GitHub
      url: https://github.com/maxmurtazin/luma-lang
      weight: 2
    - name: Search
      weight: 3
      params:
        type: search
params:
  description: Luma 0.1.3 language documentation.
  languageSwitch:
    display: true
  theme:
    default: system
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: false
    displayPoweredBy: true
  editURL:
    enable: true
    base: https://github.com/maxmurtazin/luma-lang/edit/main/site/content
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: false
